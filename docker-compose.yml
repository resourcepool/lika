# Lika: API (short links, REST API, MCP server) and web interface, built from this repository,
# for running both on one machine. On Dokploy, deploy them as two applications: docs/DOKPLOY.md.
#
#   cp api/.env.example api/.env && cp web/.env.example web/.env   # then fill them in
#   docker compose up -d --build
#
# Exposes the web interface on port 3000 and the API (short links) on port 8080: put a reverse proxy with TLS in front.
# Database: SQLite in the lika-data volume. LIKA_DB=postgres or mongo builds another one, with DB_POSTGRES_URL or
# DB_MONGODB_CONNSTRING in api/.env.

services:
  api:
    build:
      context: ./api
      args:
        DB: ${LIKA_DB:-sqlite}
    restart: unless-stopped
    env_file: ./api/.env
    ports:
      - "8080:8080"
    volumes:
      - lika-data:/data

  web:
    build:
      context: ./web
    restart: unless-stopped
    env_file: ./web/.env
    environment:
      # The API on the network of this compose project, whatever api/.env.example suggests
      LIKA_API_URL: http://api:8080
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  lika-data:

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | Lika</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #333;
        }

        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.95);
            padding: 3rem 2rem;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            max-width: 600px;
            width: 90%;
        }

        .error-code {
            font-size: 6rem;
            font-weight: bold;
            color: #ff7b7b;
            margin-bottom: 1rem;
            line-height: 1;
        }

        .error-title {
            font-size: 2rem;
            color: #333;
            margin-bottom: 1rem;
        }

        .error-message {
            font-size: 1.1rem;
            color: #666;
            margin-bottom: 2rem;
            line-height: 1.6;
        }

        .suggestions {
            background: #f8f9fa;
            padding: 1.5rem;
            border-radius: 10px;
            margin-bottom: 2rem;
            text-align: left;
        }

        .suggestions h3 {
            color: #333;
            margin-bottom: 1rem;
        }

        .suggestions ul {
            color: #666;
            padding-left: 1.5rem;
        }

        .suggestions li {
            margin-bottom: 0.5rem;
        }

        .links {
            margin-top: 2rem;
        }

        .link {
            display: inline-block;
            margin: 0.5rem;
            padding: 0.7rem 1.5rem;
            background: #ff416c;
            color: white;
            text-decoration: none;
            border-radius: 25px;
            transition: background 0.3s ease;
        }

        .link:hover {
            background: #ff7b7b;
        }

        .home-link {
            background: #28a745;
        }

        .home-link:hover {
            background: #218838;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="error-code">404</div>
        <div class="error-title">Invalid Link</div>
        <div class="error-message">
            The page you're looking for doesn't exist or may have been moved.
        </div>

        <div class="suggestions">
            <h3>What you can try:</h3>
            <ul>
                <li>Check the URL for typos</li>
                <li>Check if this is a valid deeplink slug</li>
                <li>Contact the administrator if you believe this is an error</li>
            </ul>
        </div>

        <div class="footer">
            <p>© Resourcepool 2026</p>
        </div>
    </div>
</body>
</html>

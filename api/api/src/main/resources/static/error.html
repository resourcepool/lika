<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Link not found · Lika</title>
    <style>
        /* Same look as the Lika web app: zinc canvas, hairline borders, lime accent */
        :root {
            --bg: #09090b; --card: #18181b; --border: rgba(255,255,255,.08); --input: rgba(255,255,255,.12);
            --fg: #fafafa; --muted: #a1a1aa; --brand: #a3e635; --brand-fg: #09090b; --danger: #f87171;
            color-scheme: dark;
        }
        @media (prefers-color-scheme: light) {
            :root {
                --bg: #fafafa; --card: #ffffff; --border: #e4e4e7; --input: #e4e4e7;
                --fg: #09090b; --muted: #71717a; --brand: #84cc16; --brand-fg: #09090b; --danger: #dc2626;
                color-scheme: light;
            }
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
            background: var(--bg);
            color: var(--fg);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            -webkit-font-smoothing: antialiased;
        }
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background-image:
                linear-gradient(to right, color-mix(in oklch, var(--fg) 6%, transparent) 1px, transparent 1px),
                linear-gradient(to bottom, color-mix(in oklch, var(--fg) 6%, transparent) 1px, transparent 1px);
            background-size: 32px 32px;
            mask-image: radial-gradient(ellipse at top, black 30%, transparent 75%);
        }
        .mono { font-family: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, monospace; }
        .container { position: relative; width: 100%; max-width: 380px; text-align: center; }
        .logo { width: 40px; height: 40px; margin: 0 auto 1rem; }
        h1 { font-size: 1.5rem; font-weight: 600; letter-spacing: -.02em; }
        .subtitle { margin-top: .5rem; color: var(--muted); font-size: .875rem; line-height: 1.5; }
        .card {
            margin-top: 2rem; padding: 1.5rem; text-align: left;
            background: var(--card); border: 1px solid var(--border); border-radius: .75rem;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,.4);
        }
        label { display: block; font-size: .875rem; font-weight: 500; margin-bottom: .5rem; }
        input {
            width: 100%; height: 2.25rem; padding: 0 .75rem; font-size: .875rem;
            color: var(--fg); background: transparent; border: 1px solid var(--input); border-radius: .5rem;
        }
        input:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px color-mix(in oklch, var(--brand) 30%, transparent); }
        button {
            width: 100%; height: 2.25rem; margin-top: 1rem; font-size: .875rem; font-weight: 500;
            color: var(--brand-fg); background: var(--brand); border: 0; border-radius: .5rem; cursor: pointer;
        }
        button:hover { filter: brightness(1.08); }
        .error {
            display: none; margin-top: 1rem; padding: .5rem .75rem; font-size: .875rem;
            color: var(--danger); border: 1px solid color-mix(in oklch, var(--danger) 40%, transparent); border-radius: .5rem;
        }
        .error.show { display: block; }
        .code { font-size: 4rem; font-weight: 600; letter-spacing: -.04em; color: var(--brand); line-height: 1; margin-bottom: .75rem; }
        .status { display: inline-flex; align-items: center; gap: .5rem; margin-top: 1.5rem; padding: .25rem .75rem; font-size: .75rem; border: 1px solid var(--border); border-radius: 999px; }
        .dot { width: 6px; height: 6px; border-radius: 999px; background: var(--brand); box-shadow: 0 0 6px var(--brand); }
        .footer { margin-top: 1.5rem; font-size: .75rem; color: var(--muted); }
    </style>
</head>
<body>
    <div class="container">
        <svg class="logo" viewBox="0 0 32 32" fill="none" aria-label="Lika">
            <rect x="1" y="1" width="30" height="30" rx="8" fill="currentColor" fill-opacity=".05" stroke="currentColor" stroke-opacity=".15"/>
            <path d="M13.5 18.5 18.5 13.5" stroke="var(--brand)" stroke-width="2.5" stroke-linecap="round"/>
            <path d="M14.8 10.6 16.2 9.2a4.2 4.2 0 0 1 5.9 5.9l-1.4 1.4M17.2 21.4l-1.4 1.4a4.2 4.2 0 0 1-5.9-5.9l1.4-1.4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <div class="code mono">404</div>
        <h1>Link not found</h1>
        <p class="subtitle">This short link does not exist, has expired, or is not active yet. Check the URL, or contact whoever shared it.</p>
        <p class="footer mono">lika</p>
    </div>
</body>
</html>

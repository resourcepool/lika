<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lika - Protected Link</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #333;
        }

        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.95);
            padding: 3rem 2rem;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            max-width: 600px;
            width: 90%;
        }

        .logo {
            font-size: 3rem;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 1rem;
        }

        .subtitle {
            font-size: 1.2rem;
            color: #666;
            margin-bottom: 2rem;
        }

        .password-form {
            margin: 2rem 0;
        }

        .password-input {
            width: 100%;
            padding: 0.75rem 1rem;
            font-size: 1rem;
            border: 2px solid #ddd;
            border-radius: 10px;
            margin-bottom: 1rem;
            transition: border-color 0.3s;
        }

        .password-input:focus {
            outline: none;
            border-color: #667eea;
        }

        .submit-button {
            width: 100%;
            padding: 0.75rem 1rem;
            font-size: 1rem;
            font-weight: bold;
            color: white;
            background: #667eea;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .submit-button:hover {
            background: #5568d3;
        }

        .submit-button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .error-message {
            display: none;
            padding: 0.75rem 1rem;
            background: #dc3545;
            color: white;
            border-radius: 10px;
            margin-bottom: 1rem;
        }

        .error-message.show {
            display: block;
        }

        .footer {
            margin-top: 2rem;
            font-size: 0.9rem;
            color: #999;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🔒 Lika</div>
        <div class="subtitle">This link is password protected</div>

        <div class="error-message" th:classappend="${error} ? 'show'">Invalid password. Please try again.</div>

        <!-- The password is checked by the server, which redirects to the target on success -->
        <form class="password-form" method="post" th:action="@{/{slug}(slug=${l})}">
            <input
                type="password"
                class="password-input"
                name="password"
                placeholder="Enter password"
                autocomplete="current-password"
                autofocus
                required
            >
            <button type="submit" class="submit-button">
                Ok
            </button>
        </form>

        <div class="footer">
            <p>© Resourcepool 2026</p>
        </div>
    </div>

</body>
</html>

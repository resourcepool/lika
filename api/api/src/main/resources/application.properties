management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=always
management.endpoint.health.group.liveness.show-details=always
management.endpoint.health.group.readiness.show-details=always
server.tomcat.threads.max=50
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true
server.port=8080
server.shutdown=graceful
server.error.include-message=always
spring.jpa.open-in-view=false

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.paths-to-match=/api/**,/public/**

lika.auth.provider=${LIKA_AUTH_PROVIDER:local}
lika.auth.jwt-secret=${LIKA_JWT_SECRET:}
lika.auth.web-url=${LIKA_WEB_URL:http://localhost:3000}
lika.auth.setup-token=${LIKA_SETUP_TOKEN:}
lika.auth.keycloak.url=${LIKA_KEYCLOAK_URL:}
lika.auth.keycloak.realm=${LIKA_KEYCLOAK_REALM:}
lika.auth.keycloak.client-id=${LIKA_KEYCLOAK_CLIENT_ID:}
lika.auth.keycloak.client-secret=${LIKA_KEYCLOAK_CLIENT_SECRET:}
lika.auth.keycloak.label=${LIKA_KEYCLOAK_LABEL:Keycloak}
lika.auth.firebase.project-id=${LIKA_FIREBASE_PROJECT_ID:}
lika.auth.firebase.api-key=${LIKA_FIREBASE_API_KEY:}
lika.auth.firebase.service-account=${LIKA_FIREBASE_SERVICE_ACCOUNT:}
lika.auth.firebase.emulator-host=${FIREBASE_AUTH_EMULATOR_HOST:}
lika.auth.firebase.google-client-id=${LIKA_FIREBASE_GOOGLE_CLIENT_ID:}
lika.auth.firebase.google-client-secret=${LIKA_FIREBASE_GOOGLE_CLIENT_SECRET:}
mailjet.api-key=${MAILJET_API_KEY:}
mailjet.api-secret=${MAILJET_API_SECRET:}
mailjet.sender-email=${MAIL_FROM:}
mailjet.sender-name=${MAIL_FROM_NAME:Lika}
lika.mcp.public-url=${LIKA_PUBLIC_API_URL:}
lika.mcp.allowed-origins=${LIKA_MCP_ALLOWED_ORIGINS:}

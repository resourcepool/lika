# GitLab CI/CD Pipeline for Lika Project
# Translated from GitHub Actions workflow

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/certs"
  REGISTRY: $CI_REGISTRY
  API_IMAGE_NAME: $CI_PROJECT_PATH/api
  WWW_IMAGE_NAME: $CI_PROJECT_PATH/www

stages:
  - build
  - deploy

# Cache configuration for Gradle and npm
cache:
  paths:
    - .gradle/
    - www/node_modules/

# Build API with memory database
build-api-memory:
  stage: build
  image: openjdk:21-jdk
  services:
    - docker:24.0.5-dind
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_VERIFY: 1
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - apt-get update -qy
    - apt-get install -y docker.io
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - cd api
    - chmod +x gradlew
    - ./gradlew build -x test
    - |
      # Create image tags
      if [[ "$CI_COMMIT_TAG" ]]; then
        TAG="${CI_COMMIT_TAG}-memory"
        LATEST_TAG="latest-memory"
      else
        TAG="${CI_COMMIT_SHA:0:8}-memory"
        LATEST_TAG=""
      fi
      
      # Build and push Docker image
      docker build -t "$REGISTRY/$API_IMAGE_NAME:$TAG" api/
      docker push "$REGISTRY/$API_IMAGE_NAME:$TAG"
      
      if [[ -n "$LATEST_TAG" && "$CI_COMMIT_REF_NAME" == "$CI_DEFAULT_BRANCH" ]]; then
        docker tag "$REGISTRY/$API_IMAGE_NAME:$TAG" "$REGISTRY/$API_IMAGE_NAME:$LATEST_TAG"
        docker push "$REGISTRY/$API_IMAGE_NAME:$LATEST_TAG"
      fi
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/



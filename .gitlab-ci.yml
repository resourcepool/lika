# ================================================
# DEPLOY STAGE - Push images to container registry
# ================================================

# Deploy API memory image
deploy-api-memory:
  stage: deploy
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_VERIFY: 1
    DOCKER_TLS_CERTDIR: "/certs"
  dependencies:
    - package-api-memory
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - |
      # Load and push image
      docker load < api-memory-image.tar.gz
      
      # Create image tags
      if [[ "$CI_COMMIT_TAG" ]]; then
        TAG="${CI_COMMIT_TAG}-memory"
        LATEST_TAG="latest-memory"
      else
        TAG="${CI_COMMIT_SHA:0:8}-memory"
        LATEST_TAG=""
      fi
      
      # Push main tag
      docker push "$REGISTRY/$API_IMAGE_NAME:$TAG"
      
      # Push latest tag if on default branch and it's a tag
      if [[ -n "$LATEST_TAG" && "$CI_COMMIT_REF_NAME" == "$CI_DEFAULT_BRANCH" ]]; then
        docker tag "$REGISTRY/$API_IMAGE_NAME:$TAG" "$REGISTRY/$API_IMAGE_NAME:$LATEST_TAG"
        docker push "$REGISTRY/$API_IMAGE_NAME:$LATEST_TAG"
      fi
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/



# Deploy to GitLab Pages (equivalent to GitHub Pages)
pages:
  stage: deploy
  image: node:22
  cache:
    key:
      files:
        - www/package-lock.json
    paths:
      - www/node_modules/
  dependencies:
    - build-www
  script:
    - mkdir -p public
    - cp -r www/dist/links-webapp/* public/
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/


# GitLab CI/CD Pipeline for Lika Project
# Refactored into build, package, and deploy stages

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/certs"
  REGISTRY: $CI_REGISTRY
  API_IMAGE_NAME: $CI_PROJECT_PATH/api
  WWW_IMAGE_NAME: $CI_PROJECT_PATH/www

stages:
  - build
  - package
  - deploy

# Cache configuration for Gradle and npm
cache:
  paths:
    - .gradle/
    - www/node_modules/

# ===============================
# BUILD STAGE - Create artifacts
# ===============================


# Build API artifacts
build-api-memory:
  stage: build
  image: openjdk:21-jdk
  script:
    - cd api
    - chmod +x gradlew
    - ./gradlew build -x test
  artifacts:
    paths:
      - api/api/build/libs/
      - api/api/Dockerfile
    expire_in: 1 hour
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

build-api-mongo:
  stage: build
  image: openjdk:21-jdk
  script:
    - cd api
    - chmod +x gradlew
    - ./gradlew build -x test -PdbMongo
  artifacts:
    paths:
      - api/api/build/libs/
      - api/api/Dockerfile
    expire_in: 1 hour
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

build-api-sqlite:
  stage: build
  image: openjdk:21-jdk
  script:
    - cd api
    - chmod +x gradlew
    - ./gradlew build -x test -PdbSqlite
  artifacts:
    paths:
      - api/api/build/libs/
      - api/api/Dockerfile
    expire_in: 1 hour
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/


# Build web application artifacts
build-www:
  stage: build
  image: node:22
  cache:
    key:
      files:
        - www/package-lock.json
    paths:
      - www/node_modules/
  script:
    - cd www
    - npm ci
    - npm run build
    - |
      # Create Dockerfile for web app
      cat > Dockerfile << 'EOF'
      FROM nginx:alpine
      COPY dist/links-webapp /usr/share/nginx/html
      COPY nginx.conf /etc/nginx/nginx.conf
      EXPOSE 80
      CMD ["nginx", "-g", "daemon off;"]
      EOF
      
      # Create nginx config
      cat > nginx.conf << 'EOF'
      events {
          worker_connections 1024;
      }
      http {
          include       /etc/nginx/mime.types;
          default_type  application/octet-stream;
          sendfile        on;
          keepalive_timeout  65;
          
          server {
              listen       80;
              server_name  localhost;
              root   /usr/share/nginx/html;
              index  index.html;
              
              location / {
                  try_files $uri $uri/ /index.html;
              }
              
              error_page   500 502 503 504  /50x.html;
              location = /50x.html {
                  root   /usr/share/nginx/html;
              }
          }
      }
      EOF
  artifacts:
    paths:
      - www/dist/links-webapp/
      - www/Dockerfile
      - www/nginx.conf
    expire_in: 1 hour
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/


# ==========================================
# PACKAGE STAGE - Create container images
# ==========================================

# Package API with memory database
package-api-memory:
  stage: package
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_VERIFY: 1
    DOCKER_TLS_CERTDIR: "/certs"
  dependencies:
    - build-api-memory
  script:
    - |
      # Create image tags
      if [[ "$CI_COMMIT_TAG" ]]; then
        TAG="${CI_COMMIT_TAG}-memory"
      else
        TAG="${CI_COMMIT_SHA:0:8}-memory"
      fi
      
      # Build Docker image
      docker build -t "$REGISTRY/$API_IMAGE_NAME:$TAG" api/api/
      
      # Save image for deploy stage
      docker save "$REGISTRY/$API_IMAGE_NAME:$TAG" | gzip > api-memory-image.tar.gz
  artifacts:
    paths:
      - api-memory-image.tar.gz
    expire_in: 1 hour
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/


# Package API with SQLite database

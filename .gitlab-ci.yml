# GitLab CI/CD of Lika: tests, then Docker images pushed to the project's container registry.
#
#   test     API tests (+ jar for the end-to-end tests), web unit and end-to-end tests
#   package  images built from api/Dockerfile and web/Dockerfile, pushed to $CI_REGISTRY_IMAGE:
#              api:<version>-<db>   db = sqlite, postgres, mongo, memory; also latest-<db>
#              api:<version>        the SQLite image; also latest
#              www:<version>        also latest
#            On release tags vX.Y.Z (<version> = vX.Y.Z), after the tests pass.
#            On the default branch, by hand (<version> = main, no latest).

variables:
  API_IMAGE: $CI_REGISTRY_IMAGE/api
  WWW_IMAGE: $CI_REGISTRY_IMAGE/www

stages:
  - test
  - package

# Cache configuration for Gradle
cache:
  paths:
    - .gradle/

# Tests run on merge requests, on the default branch and on release tags
.test-rules:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

# ===============================
# TEST STAGE
# ===============================

test-api:
  stage: test
  image: eclipse-temurin:21-jdk
  extends: .test-rules
  script:
    - cd api
    - chmod +x gradlew
    # The jar (in-memory database) also serves the web end-to-end tests
    - ./gradlew test :api:bootJar
  artifacts:
    when: always
    paths:
      - api/api/build/libs/
    reports:
      junit: api/api/build/test-results/test/*.xml
    expire_in: 1 hour

# Unit tests, then end-to-end tests of the web app against the real API
test-web:
  stage: test
  image: mcr.microsoft.com/playwright:v1.63.0-noble
  extends: .test-rules
  needs: [test-api]
  variables:
    LIKA_API_URL: http://localhost:8080
    LIKA_SESSION_SECRET: ci-only-session-secret-not-used-anywhere-else
    # Read by the API: lets the tests create the first admin, and loads the sample data and root key the tests use
    LIKA_SETUP_TOKEN: e2e-setup-token
    SPRING_PROFILES_ACTIVE: dev
  cache:
    key:
      files:
        - web/package-lock.json
    paths:
      - web/node_modules/
  script:
    - apt-get update -qq && apt-get install -y -qq openjdk-21-jre-headless curl > /dev/null
    - java -jar api/api/build/libs/api.jar > api.log 2>&1 &
    - cd web
    - npm ci
    - npm run lint
    - npm run typecheck
    - npm test
    - npm run build
    - cp -r .next/static .next/standalone/.next/
    - PORT=3000 HOSTNAME=127.0.0.1 node .next/standalone/server.js > ../web.log 2>&1 &
    - for i in $(seq 1 60); do curl -sf localhost:8080/actuator/health > /dev/null && curl -sf localhost:3000/health > /dev/null && break; sleep 2; done
    - npx playwright test
  artifacts:
    when: always
    paths:
      - api.log
      - web.log
      - web/test-results/
    reports:
      junit: web/test-results/e2e-junit.xml
    expire_in: 1 week

# ===============================
# PACKAGE STAGE: build and push the images
# ===============================

.package:
  stage: package
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    DOCKER_BUILDKIT: "1"
  needs: [test-api, test-web]
  cache: []
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
      variables:
        VERSION: $CI_COMMIT_TAG
        LATEST: "true"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true
      variables:
        VERSION: main
        LATEST: "false"
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    # Layers of the previous image speed up the build, when there is one
    - docker pull "$CACHE_FROM" || true
  script:
    - |
      set -e
      docker build --pull --cache-from "$CACHE_FROM" --build-arg BUILDKIT_INLINE_CACHE=1 $BUILD_ARGS \
        --label org.opencontainers.image.version="$VERSION" \
        --label org.opencontainers.image.revision="$CI_COMMIT_SHA" \
        --label org.opencontainers.image.source="$CI_PROJECT_URL" \
        -t "$IMAGE:$TAG" "$CONTEXT"
      docker push "$IMAGE:$TAG"
      for extra in $EXTRA_TAGS; do
        docker tag "$IMAGE:$TAG" "$IMAGE:$extra"
        docker push "$IMAGE:$extra"
      done

# API, one image per database
package-api:
  extends: .package
  parallel:
    matrix:
      - DB: [sqlite, postgres, mongo, memory]
  before_script:
    - IMAGE="$API_IMAGE"
    - TAG="$VERSION-$DB"
    - CONTEXT=api
    - BUILD_ARGS="--build-arg DB=$DB"
    - CACHE_FROM="$API_IMAGE:latest-$DB"
    - EXTRA_TAGS=""
    - if [ "$LATEST" = "true" ]; then EXTRA_TAGS="latest-$DB"; fi
    # The SQLite image is the default one: also tagged without suffix
    - if [ "$DB" = "sqlite" ]; then EXTRA_TAGS="$EXTRA_TAGS $VERSION"; fi
    - if [ "$DB" = "sqlite" ] && [ "$LATEST" = "true" ]; then EXTRA_TAGS="$EXTRA_TAGS latest"; fi
    - !reference [.package, before_script]

# Web interface
package-www:
  extends: .package
  before_script:
    - IMAGE="$WWW_IMAGE"
    - TAG="$VERSION"
    - CONTEXT=web
    - BUILD_ARGS=""
    - CACHE_FROM="$WWW_IMAGE:latest"
    - EXTRA_TAGS=""
    - if [ "$LATEST" = "true" ]; then EXTRA_TAGS="latest"; fi
    - !reference [.package, before_script]
